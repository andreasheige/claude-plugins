# Weekly, grouped: one PR for all minor/patch updates per ecosystem, one for security fixes.
# Majors stay separate PRs. Cooldown: no version younger than 7 days (security fixes are exempt).
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/dotnet-kit/verify/Samples"
      - "/dotnet-kit/verify/Samples.Tests"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
